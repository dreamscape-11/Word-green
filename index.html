<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Story Atelier</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4efe6;--paper:#fffdf8;--ink:#342b24;--muted:#817568;--line:#e6dccd;--accent:#80634b;--accent2:#b28b68;--soft:#eee5d9;--danger:#a64d43;--shadow:0 8px 28px #49321a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:245px 1fr}
.sidebar{background:#eee6da;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 10px}.brand h1{font:700 25px Georgia,serif;letter-spacing:.2px;margin:0}.brand p{font:italic 12px Georgia,serif;color:var(--muted);margin:3px 0}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:11px;color:#5e5043}.nav button.active,.nav button:hover{background:#fffaf2;color:var(--ink)}.nav small{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 12px;letter-spacing:1px}
.sidebar-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}
main{padding:30px clamp(18px,4vw,48px) 60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:700}.top h2{font: bold 30px Georgia,serif;margin:4px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 13px;border-radius:10px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:13px}
.hero{background:linear-gradient(120deg,#e7d8c6,#f6eee3);border:1px solid #e1d2c0;border-radius:18px;padding:25px;margin-bottom:22px}.hero h3{font: bold 24px Georgia,serif;margin:0 0 5px}.hero p{margin:0;color:#6e5e4e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 25px}.stat,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:15px}.stat b{display:block;font: bold 25px Georgia,serif}.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.section-head h3{font: bold 20px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.card{padding:16px;min-width:0}.card h4{margin:0 0 5px;font-size:17px}.card p{color:var(--muted);font-size:13px;margin:4px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cdbda9;border-radius:14px;background:#fffaf4}
.panel{padding:18px;margin-bottom:15px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fffefa;color:var(--ink);outline-color:var(--accent2)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{width:min(260px,100%);padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.editor{width:100%;min-height:52vh;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:18px;line-height:1.85;font:16px/1.9 Georgia,"Noto Serif KR",serif}
.list{display:grid;gap:9px}.list-item{padding:13px;background:#fffaf3;border:1px solid var(--line);border-radius:11px}
.note{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:3px 8px;background:var(--soft);border-radius:99px;font-size:11px;color:#6a5542}
.hidden{display:none!important}
footer{margin-top:35px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:760px){.app{display:block}.sidebar{position:sticky;top:0;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:8px}.brand{display:flex;align-items:baseline;gap:9px;padding:0 4px}.brand h1{font-size:20px}.brand p{margin:0}.nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px}.nav small{display:none}.nav button{white-space:nowrap;padding:8px 11px;font-size:13px}.sidebar-foot{display:none}main{padding:22px 15px 45px}.top{align-items:flex-start}.top h2{font-size:26px}.stats{gap:8px}.stat{padding:11px}.stat b{font-size:21px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:19px}.top-actions .btn{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><h1>Story Atelier</h1><p>Your Personal Story Workshop</p></div>
  <nav class="nav" aria-label="주 메뉴">
    <small>WORKSPACE</small>
    <button data-view="home" class="active">⌂ 대시보드</button>
    <button data-view="projects">▤ 내 소설</button>
    <button data-view="characters">♙ 등장인물</button>
    <button data-view="world">◇ 세계관</button>
    <button data-view="timeline">◷ 타임라인</button>
    <button data-view="manuscripts">✎ 원고 작성실</button>
    <button data-view="ideas">✦ 아이디어 보관함</button>
  </nav>
  <div class="sidebar-foot">A quiet place for your stories.<br>저장 데이터는 이 브라우저에 보관됩니다.</div>
</aside>
<main>
  <header class="top">
    <div><div class="eyebrow">PERSONAL WRITING SPACE</div><h2 id="pageTitle">대시보드</h2></div>
    <div class="top-actions"><button class="btn" id="exportBtn">백업 내보내기</button><button class="btn" id="importBtn">백업 불러오기</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div>
  </header>
  <div id="content"></div>
  <footer>Story Atelier · 데이터는 현재 브라우저의 저장 공간에 저장됩니다. 정기적으로 백업해 주세요.</footer>
</main>
</div>
<script>
const KEY='storyAtelier_v1';
const blank=()=>({projects:[],characters:[],world:[],events:[],chapters:[],ideas:[]});
let db=load(),view='home',editingChapter=null;
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ko-KR'):'날짜 미정'}
function setView(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
const titles={home:'대시보드',projects:'내 소설',characters:'등장인물',world:'세계관',timeline:'타임라인',manuscripts:'원고 작성실',ideas:'아이디어 보관함'};
function projectName(pid){return db.projects.find(p=>p.id===pid)?.title||'분류되지 않음'}
function card(title,desc,meta,actions=''){return `<article class="card"><h4>${esc(title)}</h4><p>${esc(desc||'설명이 아직 없습니다.')}</p><div class="meta">${esc(meta||'')}</div>${actions?`<div class="card-actions">${actions}</div>`:''}</article>`}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function projectSelect(value=''){return `<select name="projectId"><option value="">작품 선택</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===value?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`}
function render(){
 document.getElementById('pageTitle').textContent=titles[view];
 const c=document.getElementById('content');
 if(view==='home') c.innerHTML=home();
 if(view==='projects') c.innerHTML=projects();
 if(view==='characters') c.innerHTML=characters();
 if(view==='world') c.innerHTML=world();
 if(view==='timeline') c.innerHTML=timeline();
 if(view==='manuscripts') c.innerHTML=manuscripts();
 if(view==='ideas') c.innerHTML=ideas();
 bind();
}
function home(){
 const recent=[...db.chapters].sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,3);
 return `<section class="hero"><div class="eyebrow">WELCOME TO YOUR ATELIER</div><h3>이야기가 시작되는 곳.</h3><p>떠오른 장면을 기록하고, 인물을 만들고, 너만의 세계를 천천히 완성해 보세요.</p><div class="row" style="margin-top:16px"><button class="btn primary" data-go="projects">＋ 새 소설 만들기</button><button class="btn" data-go="ideas">아이디어 기록하기</button></div></section>
 <div class="stats"><div class="stat"><b>${db.projects.length}</b><span>작품</span></div><div class="stat"><b>${db.characters.length}</b><span>등장인물</span></div><div class="stat"><b>${db.chapters.length}</b><span>원고</span></div></div>
 <div class="section-head"><h3>내 작품</h3><button class="btn small" data-go="projects">모두 보기</button></div>
 ${db.projects.length?`<div class="grid">${db.projects.slice(0,4).map(p=>card(p.title,p.description,`${p.genre||'장르 미정'} · ${p.status||'구상 중'}`,`<button class="btn small" data-edit-project="${p.id}">수정</button>`)).join('')}</div>`:empty('아직 작품이 없습니다. 첫 번째 이야기를 만들어 보세요.')}
 <div class="section-head"><h3>최근 수정한 원고</h3><button class="btn small" data-go="manuscripts">원고 작성실</button></div>
 ${recent.length?`<div class="list">${recent.map(ch=>`<div class="list-item row"><div style="flex:1"><b>${esc(ch.title)}</b><div class="note">${esc(projectName(ch.projectId))} · ${new Date(ch.updated||Date.now()).toLocaleString('ko-KR')}</div></div><button class="btn small" data-open-chapter="${ch.id}">열기</button></div>`).join('')}</div>`:empty('아직 작성한 원고가 없습니다.')}
 `;
}
function projects(){return `<div class="section-head"><h3>작품 목록</h3><button class="btn primary" id="newProject">＋ 새 작품</button></div><div id="projectForm" class="panel hidden"><h3 id="projectFormTitle">새 작품 만들기</h3><form id="pForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>작품명 *</label><input name="title" required placeholder="예: 여름의 끝"></div><div class="field"><label>장르</label><input name="genre" placeholder="예: 일상, 판타지, 추리"></div><div class="field"><label>배경</label><input name="setting" placeholder="예: 현대 도쿄"></div><div class="field"><label>진행 상태</label><select name="status"><option>구상 중</option><option>집필 중</option><option>완결</option><option>보류</option></select></div><div class="field full"><label>작품 소개</label><textarea name="description" placeholder="이야기의 핵심 내용을 간단히 적어 보세요."></textarea></div><div class="field full row"><button class="btn primary" type="submit">저장</button><button class="btn" type="button" id="cancelProject">취소</button></div></form></div>${db.projects.length?`<div class="grid">${db.projects.map(p=>card(p.title,p.description,`${p.genre||'장르 미정'} · ${p.setting||'배경 미정'} · ${p.status}`,`<button class="btn small" data-edit-project="${p.id}">수정</button><button class="btn small danger" data-del-project="${p.id}">삭제</button>`)).join('')}</div>`:empty('등록된 작품이 없습니다.')}`}
function characters(){return `<div class="section-head"><h3>인물 목록</h3><button class="btn primary" id="newCharacter">＋ 인물 추가</button></div><div id="characterForm" class="panel hidden"><h3 id="charFormTitle">새 등장인물</h3><form id="cForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>이름 *</label><input name="name" required placeholder="인물 이름"></div><div class="field"><label>나이</label><input name="age" placeholder="예: 17세"></div><div class="field"><label>작품</label>${projectSelect()}</div><div class="field"><label>역할</label><input name="role" placeholder="주인공, 조력자 등"></div><div class="field full"><label>성격 및 특징</label><textarea name="personality"></textarea></div><div class="field full"><label>외모 및 배경</label><textarea name="background"></textarea></div><div class="field full"><label>비밀 / 기타 메모</label><textarea name="notes"></textarea></div><div class="field full row"><button class="btn primary">저장</button><button class="btn" type="button" id="cancelCharacter">취소</button></div></form></div><div class="section-head"><input class="search" id="charSearch" placeholder="인물 이름 검색"></div><div id="characterList" class="grid">${characterCards(db.characters)}</div>`}
function characterCards(arr){return arr.length?arr.map(x=>card(x.name,`${x.role||'역할 미정'} · ${x.age||'나이 미정'}\n${x.personality||''}`,projectName(x.projectId),`<button class="btn small" data-edit-char="${x.id}">수정</button><button class="btn small danger" data-del-char="${x.id}">삭제</button>`)).join(''):empty('등록된 인물이 없습니다.')}
function world(){return `<div class="section-head"><h3>세계관 자료</h3><button class="btn primary" id="newWorld">＋ 자료 추가</button></div><div id="worldForm" class="panel hidden"><form id="wForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>항목 이름 *</label><input name="title" required placeholder="예: 아르덴 왕국"></div><div class="field"><label>분류</label><select name="category"><option>국가</option><option>지역</option><option>종족</option><option>조직</option><option>문화</option><option>물건</option><option>기타</option></select></div><div class="field"><label>작품</label>${projectSelect()}</div><div class="field full"><label>설명</label><textarea name="description" placeholder="설정과 특징을 기록하세요."></textarea></div><div class="field full row"><button class="btn primary">저장</button><button class="btn" type="button" id="cancelWorld">취소</button></div></form></div>${db.world.length?`<div class="grid">${db.world.map(x=>card(x.title,x.description,`${x.category} · ${projectName(x.projectId)}`,`<button class="btn small" data-edit-world="${x.id}">수정</button><button class="btn small danger" data-del-world="${x.id}">삭제</button>`)).join('')}</div>`:empty('세계관 자료를 하나씩 모아 보세요.')}`}
function timeline(){return `<div class="section-head"><h3>사건 기록</h3><button class="btn primary" id="newEvent">＋ 사건 추가</button></div><div id="eventForm" class="panel hidden"><form id="eForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>사건 이름 *</label><input name="title" required></div><div class="field"><label>발생 날짜</label><input name="date" placeholder="예: 2025년 봄"></div><div class="field"><label>작품</label>${projectSelect()}</div><div class="field"><label>관련 인물</label><input name="people" placeholder="이름을 쉼표로 구분"></div><div class="field full"><label>사건 설명</label><textarea name="description"></textarea></div><div class="field full row"><button class="btn primary">저장</button><button class="btn" type="button" id="cancelEvent">취소</button></div></form></div>${db.events.length?`<div class="list">${[...db.events].sort((a,b)=>(a.sortDate||a.date||'').localeCompare(b.sortDate||b.date||'')).map(x=>`<div class="list-item"><div class="row"><span class="pill">${esc(x.date||'날짜 미정')}</span><b>${esc(x.title)}</b><span class="note">${esc(projectName(x.projectId))}</span></div><p>${esc(x.description||'')}</p><div class="note">관련 인물: ${esc(x.people||'없음')}</div><div class="card-actions"><button class="btn small" data-edit-event="${x.id}">수정</button><button class="btn small danger" data-del-event="${x.id}">삭제</button></div></div>`).join('')}</div>`:empty('아직 기록한 사건이 없습니다.')}`}
function manuscripts(){return `<div class="section-head"><h3>원고 목록</h3><button class="btn primary" id="newChapter">＋ 새 원고</button></div><div id="chapterForm" class="panel hidden"><form id="chForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>원고 제목 *</label><input name="title" required placeholder="예: 1화. 여름의 시작"></div><div class="field"><label>작품</label>${projectSelect()}</div><div class="field full"><label>본문</label><textarea name="body" id="chapterBody" style="min-height:260px" placeholder="이야기를 시작해 보세요."></textarea><div class="note" id="wordCount">공백 포함 0자 · 공백 제외 0자</div></div><div class="field full row"><button class="btn primary">원고 저장</button><button class="btn" type="button" id="cancelChapter">취소</button></div></form></div>${db.chapters.length?`<div class="list">${[...db.chapters].sort((a,b)=>(b.updated||0)-(a.updated||0)).map(x=>`<div class="list-item row"><div style="flex:1;min-width:0"><b>${esc(x.title)}</b><div class="note">${esc(projectName(x.projectId))} · ${(x.body||'').length.toLocaleString()}자 · ${new Date(x.updated||Date.now()).toLocaleString('ko-KR')}</div><p>${esc((x.body||'').slice(0,100))}${(x.body||'').length>100?'…':''}</p></div><button class="btn small" data-edit-chapter="${x.id}">열기</button><button class="btn small danger" data-del-chapter="${x.id}">삭제</button></div>`).join('')}</div>`:empty('아직 작성한 원고가 없습니다.')}`}
function ideas(){return `<div class="section-head"><h3>아이디어 보관함</h3><button class="btn primary" id="newIdea">＋ 아이디어 기록</button></div><div id="ideaForm" class="panel hidden"><form id="iForm" class="form-grid"><input type="hidden" name="id"><div class="field"><label>아이디어 제목 *</label><input name="title" required placeholder="떠오른 생각을 짧게 적어 보세요"></div><div class="field"><label>분류</label><select name="category"><option>장면</option><option>대사</option><option>인물</option><option>사건</option><option>배경</option><option>기타</option></select></div><div class="field"><label>연결할 작품</label>${projectSelect()}</div><div class="field full"><label>내용</label><textarea name="body" placeholder="생각을 자유롭게 기록하세요."></textarea></div><div class="field full row"><button class="btn primary">저장</button><button class="btn" type="button" id="cancelIdea">취소</button></div></form></div>${db.ideas.length?`<div class="grid">${db.ideas.map(x=>card(x.title,x.body,`${x.category} · ${projectName(x.projectId)}`,`<button class="btn small" data-edit-idea="${x.id}">수정</button><button class="btn small danger" data-del-idea="${x.id}">삭제</button>`)).join('')}</div>`:empty('떠오르는 생각을 자유롭게 모아 보세요.')}`}
function show(id){document.getElementById(id)?.classList.remove('hidden')}
function hide(id){document.getElementById(id)?.classList.add('hidden')}
function fill(form,obj){Object.keys(obj).forEach(k=>{const el=form.elements[k];if(el)el.value=obj[k]??''})}
function getForm(form){return Object.fromEntries(new FormData(form).entries())}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));
 const bindForm=(newId,formId,submit, cancelId)=>{document.getElementById(newId)?.addEventListener('click',()=>{document.getElementById(formId).reset();document.querySelector(`#${formId} [name=id]`).value='';show(formId)});document.getElementById(cancelId)?.addEventListener('click',()=>hide(formId));document.getElementById(formId)?.addEventListener('submit',e=>{e.preventDefault();submit(getForm(e.target));})};
 bindForm('newProject','pForm',v=>{if(v.id){Object.assign(db.projects.find(x=>x.id===v.id),v)}else db.projects.push({id:id(),...v});save();render()},'cancelProject');
 document.querySelectorAll('[data-edit-project]').forEach(b=>b.onclick=()=>{const x=db.projects.find(x=>x.id===b.dataset.editProject);show('projectForm');fill(document.getElementById('pForm'),x)});
 document.querySelectorAll('[data-del-project]').forEach(b=>b.onclick=()=>{if(confirm('작품을 삭제할까요? 연결된 다른 자료는 유지됩니다.')){db.projects=db.projects.filter(x=>x.id!==b.dataset.delProject);save();render()}});
 bindForm('newCharacter','cForm',v=>{if(v.id)Object.assign(db.characters.find(x=>x.id===v.id),v);else db.characters.push({id:id(),...v});save();render()},'cancelCharacter');
 document.querySelectorAll('[data-edit-char]').forEach(b=>b.onclick=()=>{show('characterForm');fill(document.getElementById('cForm'),db.characters.find(x=>x.id===b.dataset.editChar))});
 document.querySelectorAll('[data-del-char]').forEach(b=>b.onclick=()=>{if(confirm('이 인물을 삭제할까요?')){db.characters=db.characters.filter(x=>x.id!==b.dataset.delChar);save();render()}});
 document.getElementById('charSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.getElementById('characterList').innerHTML=characterCards(db.characters.filter(x=>x.name.toLowerCase().includes(q)))});
 bindForm('newWorld','wForm',v=>{if(v.id)Object.assign(db.world.find(x=>x.id===v.id),v);else db.world.push({id:id(),...v});save();render()},'cancelWorld');
 document.querySelectorAll('[data-edit-world]').forEach(b=>b.onclick=()=>{show('worldForm');fill(document.getElementById('wForm'),db.world.find(x=>x.id===b.dataset.editWorld))});
 document.querySelectorAll('[data-del-world]').forEach(b=>b.onclick=()=>{if(confirm('자료를 삭제할까요?')){db.world=db.world.filter(x=>x.id!==b.dataset.delWorld);save();render()}});
 bindForm('newEvent','eForm',v=>{if(v.id)Object.assign(db.events.find(x=>x.id===v.id),v);else db.events.push({id:id(),...v});save();render()},'cancelEvent');
 document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>{show('eventForm');fill(document.getElementById('eForm'),db.events.find(x=>x.id===b.dataset.editEvent))});
 document.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{if(confirm('사건을 삭제할까요?')){db.events=db.events.filter(x=>x.id!==b.dataset.delEvent);save();render()}});
 bindForm('newChapter','chForm',v=>{v.updated=Date.now();if(v.id)Object.assign(db.chapters.find(x=>x.id===v.id),v);else db.chapters.push({id:id(),...v});save();render()},'cancelChapter');
 document.querySelectorAll('[data-edit-chapter],[data-open-chapter]').forEach(b=>b.onclick=()=>{const x=db.chapters.find(x=>x.id===(b.dataset.editChapter||b.dataset.openChapter));show('chapterForm');fill(document.getElementById('chForm'),x);updateCount()});
 document.querySelectorAll('[data-del-chapter]').forEach(b=>b.onclick=()=>{if(confirm('원고를 삭제할까요?')){db.chapters=db.chapters.filter(x=>x.id!==b.dataset.delChapter);save();render()}});
 document.getElementById('chapterBody')?.addEventListener('input',updateCount);
 bindForm('newIdea','iForm',v=>{if(v.id)Object.assign(db.ideas.find(x=>x.id===v.id),v);else db.ideas.push({id:id(),...v});save();render()},'cancelIdea');
 document.querySelectorAll('[data-edit-idea]').forEach(b=>b.onclick=()=>{show('ideaForm');fill(document.getElementById('iForm'),db.ideas.find(x=>x.id===b.dataset.editIdea))});
 document.querySelectorAll('[data-del-idea]').forEach(b=>b.onclick=()=>{if(confirm('아이디어를 삭제할까요?')){db.ideas=db.ideas.filter(x=>x.id!==b.dataset.delIdea);save();render()}});
}
function updateCount(){const t=document.getElementById('chapterBody')?.value||'';const el=document.getElementById('wordCount');if(el)el.textContent=`공백 포함 ${t.length.toLocaleString()}자 · 공백 제외 ${t.replace(/\s/g,'').length.toLocaleString()}자`}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Story Atelier',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`StoryAtelier_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const incoming=obj.data||obj;if(!incoming.projects||!incoming.characters)throw Error('백업 형식이 올바르지 않습니다.');if(confirm('현재 데이터가 백업 파일의 데이터로 교체됩니다. 계속할까요?')){db={...blank(),...incoming};save();render();alert('백업 데이터를 불러왔습니다.')}}catch(err){alert('파일을 읽지 못했습니다: '+err.message)}e.target.value=''};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
